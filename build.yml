name: Build JARVIS Windows EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JARVIS-PC app.py
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-PC-Windows-EXE
          path: dist/JARVIS-PC.exe
